hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_megatron_trainer
  - _self_

# config for the rollout (only for resource isolation)
rollout:
  # Number of nodes used in the rollout
  nnodes: 1
  # Number of GPUs per node
  n_gpus_per_node: 8

# To adapt to the current logic of AgentLoopManager
actor_rollout_ref:
  rollout:
    # Must be turned off! Otherwise, Parameter synchronization cannot be performed.
    free_cache_engine: False
    # Must be enabled! Otherwise, log_probs cannot be calculated.
    calculate_log_probs: True

    checkpoint_engine:
      backend: "nccl"

# Only then will the use of log probs be correct.
# And it can be used in conjunction with other rollout_correction algorithms.
algorithm:
  rollout_correction:
    bypass_mode: True
trainer:
  # Dynamic resize migration entrypoint. Keep disabled by default so current
  # one-step-off behavior is unchanged unless explicitly enabled.
  dynamic_resize:
    enable: false
    shared_pool: false
    mode: schedule
    hard_switch:
      enable: false
    trace:
      enable: false
      path: ""
      run_name: ""
      flush: false
    budget_protection:
      enable: false
      memory_budget_ratio: 0.85
    hysteresis:
      enable: false
      window_size: 2
      up_threshold: 1.15
      down_threshold: 0.9
      min_dwell_steps: 1
      cooldown_steps: 0
      consecutive_signal_steps: 1
      min_observation_count: 1
    schedule: []
